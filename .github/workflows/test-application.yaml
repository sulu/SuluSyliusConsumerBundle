name: Test application

on:
    pull_request:
    push:
        branches:
            - '[0-9]+.x'
            - '[0-9]+.[0-9]+'

jobs:
    test:
        name: "PHP ${{ matrix.php-version }} (dependency ${{ matrix.dependency-versions }})"
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: mysql://root:root@127.0.0.1:3306/sulu_test?serverVersion=8.0

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: '7.4'
                      dependency-versions: 'lowest'
                      php-extensions: 'ctype, iconv, mysql, imagick'
                      tools: 'composer:v2'
                      lint: false
                      phpunit-config: 'phpunit-9.xml.dist'
                      env:
                          SYMFONY_DEPRECATIONS_HELPER: weak

                    - php-version: '7.4'
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mysql, imagick'
                      tools: 'composer:v2'
                      lint: false
                      phpunit-config: 'phpunit-9.xml.dist'
                      env:
                          SYMFONY_DEPRECATIONS_HELPER: weak

                    - php-version: '8.0'
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mysql, imagick'
                      tools: 'composer:v2'
                      lint: true
                      env:
                        SYMFONY_DEPRECATIONS_HELPER: weak
                    - php-version: '8.1'
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mysql, imagick'
                      tools: 'composer:v2'
                      lint: true
                      env:
                        SYMFONY_DEPRECATIONS_HELPER: weak
                    - php-version: '8.2'
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mysql, imagick'
                      tools: 'composer:v2'
                      lint: true
                      env:
                        SYMFONY_DEPRECATIONS_HELPER: weak
                    - php-version: '8.3'
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mysql, imagick'
                      tools: 'composer:v2'
                      lint: true
                      env:
                        SYMFONY_DEPRECATIONS_HELPER: weak
                    - php-version: '8.4'
                      dependency-versions: 'highest'
                      composer-options: '--ignore-platform-reqs'
                      php-extensions: 'ctype, iconv, mysql, imagick'
                      tools: 'composer:v2'
                      lint: true
                      env:
                        SYMFONY_DEPRECATIONS_HELPER: weak

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

        steps:
            - name: Checkout project
              uses: actions/checkout@v4

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: ${{ matrix.php-extensions }}
                  tools: ${{ matrix.tools }}
                  coverage: none

            - name: Allow old composer plugin
              run: composer config --no-plugins allow-plugins.ocramius/package-versions true # todo remove when not longer required for lowest task

            - name: Remove Lint Tools
              # These tools are not required to run tests, so we are removing them to improve dependency resolving and
              # testing lowest versions.
              run: composer remove "*php-cs-fixer*" "*phpstan*" "*rector*" --dev --no-update

            - name: Install composer dependencies
              uses: ramsey/composer-install@v2
              with:
                  dependency-versions: ${{matrix.dependency-versions}}
                  composer-options: ${{matrix.composer-options}}

            - name: Bootstrap test environment
              run: composer initialize
              env: ${{ matrix.env }}

            - name: Execute test cases
              run: time composer test -- --config ${{ matrix.phpunit-config || 'phpunit.xml.dist' }}
              env: ${{ matrix.env }}

    lint:
        name: "PHP Lint"
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: mysql://root:root@127.0.0.1:3306/sulu_test?serverVersion=8.0

        steps:
            - name: Checkout project
              uses: actions/checkout@v4

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  extensions: 'ctype, iconv, mysql, imagick'
                  tools: 'composer:v2'
                  coverage: none

            - name: Install composer dependencies
              uses: ramsey/composer-install@v2
              with:
                  dependency-versions: highest

            - name: Lint code
              run: composer lint
